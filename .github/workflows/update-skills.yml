name: update-skills
on:
  schedule:
    - cron: "0 21 * * 5" # 매주 토요일 06:00 KST (금요일 21:00 UTC)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 에이전트가 하나도 감지되지 않으면 skills CLI가 모든 에이전트(Eve의 agent/skills 포함)에 설치한다.
      # ~/.claude를 만들어 Claude Code를 감지시키면 .agents/skills + .claude/skills symlink에만 설치된다.
      - run: mkdir -p ~/.claude
      - run: npx -y skills update -p -y
      # lock 해시는 설치 경로(로컬 clone / CI)에 따라 값이 달라 파일 변화 없이도 바뀐다.
      # 스킬 파일이 그대로면 lock만 바뀐 것이므로 되돌려 PR이 생기지 않게 한다.
      - run: |
          if git diff --quiet -- . ':!skills-lock.json' && [ -z "$(git ls-files -o --exclude-standard)" ]; then
            git checkout -- skills-lock.json
          fi
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/update-skills
          base: main
          title: "chore: update external skills"
          commit-message: "chore: update external skills"
          body: |
            `npx skills update -p -y` 결과입니다. 머지 전에 상류 변경 내용을 diff로 검토하세요.
